<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>TestCraft — Student</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--border:#2a2a3a;
  --orange:#ff6b2b;--orange2:#ff8c42;--cyan:#00d4ff;--cyan2:#00f0e0;
  --gold:#ffd700;--green:#00e676;--red:#ff4757;
  --ink:#ffffff;--ink2:#a0a0b8;--ink3:#505068;
  --r:20px;--rs:12px;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--ink);max-width:430px;margin:0 auto;height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:'Nunito',sans-serif;font-weight:800;border:none;border-radius:var(--r);transition:all .18s cubic-bezier(.34,1.56,.64,1);letter-spacing:.3px}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
input,select{font-family:'Nunito',sans-serif;font-size:15px;font-weight:600;border:2px solid var(--border);border-radius:var(--rs);padding:14px 16px;background:var(--surface2);color:var(--ink);width:100%;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none}
input::placeholder{color:var(--ink3)}
input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,212,255,.15)}
select option{background:var(--surface2)}
label{display:block;font-size:12px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.btn-primary{width:100%;padding:18px 24px;font-size:16px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;border-radius:var(--r);box-shadow:0 0 20px rgba(255,107,43,.4)}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 0 30px rgba(255,107,43,.6)}
.btn-cyan{width:100%;padding:18px 24px;font-size:16px;background:linear-gradient(135deg,var(--cyan),var(--cyan2));color:#000;border-radius:var(--r);box-shadow:0 0 20px rgba(0,212,255,.4)}
.btn-ghost{width:100%;padding:16px 24px;font-size:15px;background:transparent;color:var(--ink2);border:2px solid var(--border);border-radius:var(--r)}
.btn-ghost:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan)}
.btn-danger{width:100%;padding:12px 16px;font-size:13px;background:transparent;color:var(--red);border:1px solid rgba(255,71,87,.3);border-radius:var(--rs)}
.btn-danger:hover{background:rgba(255,71,87,.1);border-color:var(--red)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;display:flex;flex-direction:column;gap:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.logo-text{font-size:20px;font-weight:900;background:linear-gradient(135deg,var(--orange),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.opt-btn{width:100%;padding:16px 18px;border-radius:var(--rs);border:2px solid var(--border);background:var(--surface);text-align:left;font-size:15px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:14px;transition:all .2s;cursor:pointer}
.opt-btn:hover:not(:disabled){border-color:var(--cyan);background:rgba(0,212,255,.05);box-shadow:0 0 20px rgba(0,212,255,.2)}
.opt-btn.selected{border-color:var(--orange);background:rgba(255,107,43,.1);box-shadow:0 0 20px rgba(255,107,43,.3);color:var(--orange)}
.opt-letter{width:32px;height:32px;border-radius:50%;background:var(--surface2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex-shrink:0;transition:all .2s}
.opt-btn.selected .opt-letter{background:var(--orange);border-color:var(--orange);color:#fff}
.progress-track{height:5px;background:var(--border);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--cyan));transition:width .4s ease}
.error-box{background:rgba(255,71,87,.15);border:1px solid rgba(255,71,87,.3);color:var(--red);padding:12px 16px;border-radius:var(--rs);font-size:14px;font-weight:700}
.stat-pill{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 10px;border-radius:var(--rs);background:var(--surface2);border:1px solid var(--border);flex:1}
.spinner{width:22px;height:22px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:middle}
.save-badge{position:fixed;bottom:20px;right:20px;background:rgba(0,230,118,.15);border:1px solid rgba(0,230,118,.3);color:var(--green);padding:8px 14px;border-radius:20px;font-size:12px;font-weight:800;pointer-events:none;opacity:0;transition:opacity .3s;z-index:999}
.save-badge.show{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.fade-in{animation:fadeUp .35s ease forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- Save badge -->
<div class="save-badge" id="save-badge">💾 Saved</div>

<!-- ══════════════════ LOGIN SCREEN ══════════════════ -->
<div id="screen-login" style="flex:1;display:flex;flex-direction:column;background:var(--bg)">
  <div style="height:4px;background:linear-gradient(90deg,var(--orange),var(--cyan))"></div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 24px">
    <div style="text-align:center;margin-bottom:36px">
      <svg width="90" height="90" viewBox="0 0 100 100" fill="none" style="margin:0 auto 14px;display:block">
        <circle cx="50" cy="50" r="50" fill="var(--surface)"/>
        <rect x="28" y="30" width="44" height="40" rx="4" fill="var(--surface2)" stroke="var(--border)" stroke-width="1.5"/>
        <rect x="28" y="30" width="22" height="40" rx="4" fill="#ff6b2b" opacity=".9"/>
        <line x1="50" y1="30" x2="50" y2="70" stroke="var(--border)" stroke-width="1.5"/>
        <line x1="55" y1="42" x2="66" y2="42" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
        <line x1="55" y1="49" x2="68" y2="49" stroke="#00d4ff" stroke-width="2" stroke-linecap="round" opacity=".6"/>
        <line x1="55" y1="56" x2="63" y2="56" stroke="#00d4ff" stroke-width="2" stroke-linecap="round" opacity=".4"/>
        <path d="M39 44l1.5 3 3.5.5-2.5 2.5.5 3.5L39 52l-2.5 1.5.5-3.5-2.5-2.5 3.5-.5z" fill="white"/>
      </svg>
      <div style="font-size:30px;font-weight:900;background:linear-gradient(135deg,var(--orange),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent">TestCraft</div>
      <div style="color:var(--ink2);font-size:13px;font-weight:600;margin-top:4px">Student Portal</div>
    </div>
    <div style="background:var(--surface);border-radius:24px;padding:28px 24px;border:1px solid var(--border)">
      <div style="font-size:20px;font-weight:800;margin-bottom:6px">Welcome</div>
      <div style="color:var(--ink2);font-size:13px;font-weight:600;margin-bottom:22px">Sign in to start your quiz</div>
      <div id="login-error" class="error-box hidden" style="margin-bottom:14px"></div>
      <div style="margin-bottom:14px">
        <label>Username</label>
        <input id="inp-user" type="text" placeholder="Enter username" autocomplete="off"/>
      </div>
      <div style="margin-bottom:24px">
        <label>Password</label>
        <input id="inp-pass" type="password" placeholder="••••••••"/>
      </div>
      <button class="btn-primary" onclick="doLogin()">Sign In</button>
    </div>
    <div style="text-align:center;color:var(--ink3);font-size:12px;margin-top:20px;font-weight:600">
      TestCraft &copy; 2025 &nbsp;·&nbsp;
      <a href="https://instagram.com/mhrbhatti" target="_blank" style="color:var(--cyan);text-decoration:none">@mhrbhatti</a>
    </div>
  </div>
</div>

<!-- ══════════════════ HOME SCREEN ══════════════════ -->
<div id="screen-home" class="hidden" style="flex:1;display:flex;flex-direction:column;background:var(--bg)">
  <div class="topbar">
    <div>
      <div class="logo-text">TestCraft</div>
      <div id="home-class" style="font-size:11px;color:var(--ink2);font-weight:700;margin-top:1px"></div>
    </div>
    <button onclick="doLogout()" style="background:var(--surface2);color:var(--ink2);padding:8px 12px;border-radius:10px;border:1px solid var(--border);font-size:13px">Logout</button>
  </div>
  <div class="screen">
    <!-- Hero -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:20px;position:relative;overflow:hidden">
      <div style="position:absolute;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(255,107,43,.15) 0%,transparent 70%);top:-40px;right:-40px"></div>
      <div style="position:absolute;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,.1) 0%,transparent 70%);bottom:-20px;left:-20px"></div>
      <div style="position:relative">
        <div style="font-size:13px;color:var(--ink2);font-weight:700;margin-bottom:2px">Welcome back,</div>
        <div id="home-name" style="font-size:22px;font-weight:900;margin-bottom:16px"></div>
        <div style="display:flex;gap:10px">
          <div class="stat-pill"><div style="font-size:18px;font-weight:900;color:var(--orange)" id="home-score">—</div><div style="font-size:10px;color:var(--ink2);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-top:2px">Best Score</div></div>
          <div class="stat-pill"><div style="font-size:18px;font-weight:900;color:var(--cyan)" id="home-quizzes">0</div><div style="font-size:10px;color:var(--ink2);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-top:2px">Quizzes</div></div>
          <div class="stat-pill"><div style="font-size:18px;font-weight:900;color:var(--gold)" id="home-xp">0</div><div style="font-size:10px;color:var(--ink2);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-top:2px">XP</div></div>
        </div>
      </div>
    </div>

    <!-- Quiz launcher -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:20px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px"><div style="font-size:12px;font-weight:800;color:var(--orange);text-transform:uppercase;letter-spacing:1px">Start a Quiz</div><div id="quiz-class-badge" style="font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;background:rgba(0,212,255,.1);color:var(--cyan);border:1px solid rgba(0,212,255,.2)"></div></div>
      <div id="home-error" class="error-box hidden" style="margin-bottom:14px"></div>
      <div style="margin-bottom:14px">
        <label>Subject</label>
        <select id="sel-subject" onchange="loadChapters()"></select>
      </div>
      <div style="margin-bottom:14px">
        <label>Chapter</label>
        <select id="sel-chapter"><option value="">Select chapter...</option></select>
      </div>
      <div style="margin-bottom:20px">
        <label>Number of Questions</label>
        <div style="display:flex;gap:8px" id="count-btns"></div>
      </div>
      <button class="btn-primary" onclick="startQuiz()">Start Quiz</button>
    </div>

    <!-- Recent -->
    <div id="recent-block" class="hidden" style="background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px 18px">
      <div style="font-size:12px;font-weight:800;color:var(--cyan);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">Recent Quizzes</div>
      <div id="recent-list"></div>
    </div>

    <!-- Reset data -->
    <div style="padding:4px 0 8px">
      <button class="btn-danger" onclick="confirmResetData()">🗑 Clear My Saved Data</button>
    </div>
  </div>
</div>

<!-- ══════════════════ QUIZ SCREEN ══════════════════ -->
<div id="screen-quiz" class="hidden" style="flex:1;display:flex;flex-direction:column;background:var(--bg)">
  <div class="progress-track" style="flex-shrink:0"><div class="progress-fill" id="quiz-progress" style="width:0%"></div></div>
  <div class="topbar">
    <div>
      <div id="quiz-chapter-label" style="font-size:11px;color:var(--ink2);font-weight:800;text-transform:uppercase;letter-spacing:.8px"></div>
      <div style="font-size:15px;font-weight:900"><span id="quiz-qnum"></span> <span style="color:var(--ink2);font-weight:600">of <span id="quiz-total"></span></span></div>
    </div>
    <div style="position:relative;width:52px;height:52px">
      <svg width="52" height="52" style="transform:rotate(-90deg)">
        <circle cx="26" cy="26" r="22" fill="none" stroke="var(--surface2)" stroke-width="4"/>
        <circle id="timer-ring" cx="26" cy="26" r="22" fill="none" stroke="var(--cyan)" stroke-width="4" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="0" style="transition:stroke-dashoffset 1s linear,stroke .3s"/>
      </svg>
      <div id="timer-text" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:var(--cyan)">30</div>
    </div>
  </div>
  <div style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 18px;display:flex;flex-direction:column">
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px 20px;margin-bottom:20px;border-left:4px solid var(--orange);box-shadow:0 4px 20px rgba(0,0,0,.3)">
      <div style="font-size:11px;color:var(--orange);font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Question</div>
      <div id="quiz-question" style="font-size:16px;font-weight:700;line-height:1.6;color:var(--ink)"></div>
    </div>
    <div id="quiz-options" style="display:flex;flex-direction:column;gap:10px;flex:1"></div>
    <div style="margin-top:20px">
      <button class="btn-primary hidden" id="btn-next" onclick="nextQuestion()">Next Question</button>
      <button class="btn-ghost" id="btn-skip" onclick="skipQuestion()">Skip</button>
    </div>
  </div>
</div>

<!-- ══════════════════ RESULTS SCREEN ══════════════════ -->
<div id="screen-results" class="hidden" style="flex:1;display:flex;flex-direction:column;background:var(--bg)">
  <div style="height:4px;background:linear-gradient(90deg,var(--orange),var(--cyan))"></div>
  <div class="topbar">
    <div style="width:24px"></div>
    <div style="font-weight:800;font-size:16px">Quiz Results</div>
    <div style="width:24px"></div>
  </div>
  <div style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 16px">
    <div style="text-align:center;margin-bottom:22px">
      <div style="position:relative;width:140px;height:140px;margin:0 auto">
        <svg width="140" height="140" style="transform:rotate(-90deg)">
          <circle cx="70" cy="70" r="54" fill="none" stroke="var(--surface2)" stroke-width="10"/>
          <circle id="score-ring" cx="70" cy="70" r="54" fill="none" stroke="var(--green)" stroke-width="10" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="339.3" style="transition:stroke-dashoffset 1.2s ease,stroke .3s;filter:drop-shadow(0 0 8px var(--green))"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <div id="res-score-pct" style="font-size:32px;font-weight:900;line-height:1;color:var(--green)"></div>
          <div id="res-score-label" style="font-size:11px;color:var(--ink2);font-weight:800;margin-top:4px;text-transform:uppercase;letter-spacing:.5px"></div>
        </div>
      </div>
      <div id="res-chapter" style="font-size:14px;color:var(--ink2);font-weight:700;margin-top:10px"></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">
      <div style="background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.2);border-radius:16px;padding:14px 8px;text-align:center">
        <div id="res-correct" style="font-size:26px;font-weight:900;color:var(--green)"></div>
        <div style="font-size:11px;color:var(--green);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-top:3px">Correct</div>
      </div>
      <div style="background:rgba(255,71,87,.1);border:1px solid rgba(255,71,87,.2);border-radius:16px;padding:14px 8px;text-align:center">
        <div id="res-wrong" style="font-size:26px;font-weight:900;color:var(--red)"></div>
        <div style="font-size:11px;color:var(--red);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-top:3px">Wrong</div>
      </div>
      <div style="background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.2);border-radius:16px;padding:14px 8px;text-align:center">
        <div id="res-skipped" style="font-size:26px;font-weight:900;color:var(--gold)"></div>
        <div style="font-size:11px;color:var(--gold);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-top:3px">Skipped</div>
      </div>
    </div>

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:12px;color:var(--ink2);font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px">XP Earned</div>
        <div id="res-xp" style="font-size:32px;font-weight:900;color:var(--orange)"></div>
      </div>
      <svg width="48" height="48" viewBox="0 0 24 24" fill="var(--orange)" opacity=".3">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
      </svg>
    </div>

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px 18px;margin-bottom:20px">
      <div style="font-size:12px;font-weight:800;color:var(--cyan);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px">Answer Review</div>
      <div id="res-review" style="display:flex;flex-direction:column;gap:10px"></div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;padding-bottom:20px">
      <button class="btn-primary" onclick="goHome()">Back to Home</button>
      <button class="btn-ghost" onclick="goHome()">Try Another Quiz</button>
    </div>
  </div>
</div>

<script>

// LOCAL STORAGE HELPERS
// ══════════════════════════════════════════
const STORAGE_KEY = 'testcraft_v1';

function loadAllData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}

function saveAllData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    flashSaveBadge();
  } catch(e) { console.warn('Storage save failed', e); }
}

function loadUserData(username) {
  const all = loadAllData();
  return all[username] || { quizzes: 0, xp: 0, best: null, recent: [] };
}

function saveUserData(username, userData) {
  const all = loadAllData();
  all[username] = userData;
  saveAllData(all);
}

function flashSaveBadge() {
  const badge = document.getElementById('save-badge');
  badge.classList.add('show');
  setTimeout(() => badge.classList.remove('show'), 1800);
}

// SCREENS
// ══════════════════════════════════════════
function showScreen(id) {
  ['screen-login','screen-home','screen-quiz','screen-results'].forEach(s => {
    const el = document.getElementById(s);
    el.classList.add('hidden');
    el.style.display = 'none';
  });
  const target = document.getElementById(id);
  target.classList.remove('hidden');
  target.style.display = 'flex';
  target.classList.add('fade-in');
  setTimeout(() => target.classList.remove('fade-in'), 400);
}

// ══════════════════════════════════════════
// LOGIN
// ══════════════════════════════════════════
function doLogin() {
  const u = document.getElementById('inp-user').value.trim().toLowerCase();
  const p = document.getElementById('inp-pass').value;
  const errEl = document.getElementById('login-error');
  const user = USERS.find(x => x.username.toLowerCase() === u && x.password === p);
  if (!user) {
    errEl.textContent = 'Invalid username or password.';
    errEl.classList.remove('hidden');
    return;
  }
  errEl.classList.add('hidden');
  currentUser = user;
  // Load persisted data for this user
  userData = loadUserData(user.username);
  initHome();
  showScreen('screen-home');
}

document.getElementById('inp-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
document.getElementById('inp-user').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('inp-pass').focus(); });

function doLogout() {
  currentUser = null;
  userData = null;
  document.getElementById('inp-user').value = '';
  document.getElementById('inp-pass').value = '';
  showScreen('screen-login');
}

  renderRecentList();

  const selSubject = document.getElementById('sel-subject');

  } else {
    selSubject.innerHTML = subjects.map(s => `<option>${s}</option>`).join('');
  }
  loadChapters();

  const counts = [5,10,15,20];
  quizCount = 10;
  document.getElementById('count-btns').innerHTML = counts.map(n =>
    `<button onclick="setCount(${n},this)" style="flex:1;padding:12px 0;border-radius:12px;font-weight:900;font-size:16px;font-family:Nunito,sans-serif;cursor:pointer;transition:all .2s;background:${n===10?'var(--orange)':'var(--surface2)'};color:${n===10?'#fff':'var(--ink2)'};border:${n===10?'none':'1px solid var(--border)'};box-shadow:${n===10?'0 0 20px rgba(255,107,43,.4)':'none'}">${n}</button>`
  ).join('');
}

function updateHomeStats() {
  document.getElementById('home-quizzes').textContent = userData.quizzes;
  document.getElementById('home-xp').textContent = userData.xp;
  document.getElementById('home-score').textContent = userData.best !== null ? userData.best + '%' : '—';
}

function renderRecentList() {
  const block = document.getElementById('recent-block');
  const list  = document.getElementById('recent-list');
  if (!userData.recent || userData.recent.length === 0) {
    block.classList.add('hidden');
    return;
  }
  block.classList.remove('hidden');
  list.innerHTML = '';
  // Show last 10, most recent first
  [...userData.recent].reverse().slice(0, 10).forEach(r => {
    const color = r.score>=80?'var(--green)':r.score>=50?'var(--gold)':'var(--red)';
    const bg    = r.score>=80?'rgba(0,230,118,.12)':r.score>=50?'rgba(255,215,0,.12)':'rgba(255,71,87,.12)';
    const item  = document.createElement('div');
    item.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)';
    item.innerHTML = `<div><div style="font-weight:700;font-size:14px">${r.chapter}</div><div style="font-size:12px;color:var(--ink2);margin-top:2px">${r.total} Qs · +${r.xp} XP · <span style="color:var(--ink3)">${r.date}</span></div></div><div style="padding:6px 14px;border-radius:10px;font-weight:900;font-size:15px;background:${bg};color:${color}">${r.score}%</div>`;
    list.appendChild(item);
  });
}

function setCount(n, btn) {
  quizCount = n;
  document.querySelectorAll('#count-btns button').forEach(b => {
    b.style.background = 'var(--surface2)';
    b.style.color = 'var(--ink2)';
    b.style.border = '1px solid var(--border)';
    b.style.boxShadow = 'none';
  });
  btn.style.background = 'var(--orange)';
  btn.style.color = '#fff';
  btn.style.border = 'none';
  btn.style.boxShadow = '0 0 20px rgba(255,107,43,.4)';
}

function loadChapters() {
  const subject = document.getElementById('sel-subject').value;
  const myClass = currentUser ? currentUser.classLevel : null;
  const chapters = [...new Set(QUESTIONS.filter(q => q.subject===subject && q.classLevel===myClass).map(q => q.chapter))];
  const sel = document.getElementById('sel-chapter');
  sel.innerHTML = '<option value="">Select chapter...</option>' + chapters.map(c => `<option>${c}</option>`).join('');
}

function startQuiz() {
  const subject = document.getElementById('sel-subject').value;
  const chapter = document.getElementById('sel-chapter').value;
  const errEl   = document.getElementById('home-error');
  if (!chapter) { errEl.textContent='Please select a chapter first.'; errEl.classList.remove('hidden'); return; }
  errEl.classList.add('hidden');

  const pool = QUESTIONS.filter(q => q.subject===subject && q.chapter===chapter && q.classLevel===currentUser.classLevel);
  if (pool.length === 0) { errEl.textContent='No questions found for this chapter.'; errEl.classList.remove('hidden'); return; }

  const count = Math.min(quizCount, pool.length);
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  quizQuestions = shuffled.slice(0, count);
  currentQIndex = 0;
  answers = [];

  document.getElementById('quiz-chapter-label').textContent = chapter;
  showScreen('screen-quiz');
  renderQuestion();
}

// ══════════════════════════════════════════
// QUIZ
// ══════════════════════════════════════════
function renderQuestion() {
  selectedAnswer = null;
  const q = quizQuestions[currentQIndex];
  const total = quizQuestions.length;

  document.getElementById('quiz-progress').style.width = `${(currentQIndex/total)*100}%`;
  document.getElementById('quiz-qnum').textContent = `Q${currentQIndex+1}`;
  document.getElementById('quiz-total').textContent = total;
  document.getElementById('quiz-question').textContent = q.q;
  document.getElementById('btn-next').classList.add('hidden');
  document.getElementById('btn-skip').classList.remove('hidden');

  const optsEl = document.getElementById('quiz-options');
  optsEl.innerHTML = q.opts.map((opt, i) =>
    `<button class="opt-btn" onclick="selectAnswer('${opt.replace(/'/g,"\\'")}',this)">
      <span class="opt-letter">${String.fromCharCode(65+i)}</span>
      <span style="flex:1">${opt}</span>
    </button>`
  ).join('');

  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = 30;
  updateTimerUI();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) { clearInterval(timerInterval); autoSkip(); }
  }, 1000);
}

function updateTimerUI() {
  const circ = 138.2;
  const offset = circ * (1 - timeLeft/30);
  const color = timeLeft>15?'var(--cyan)':timeLeft>7?'var(--gold)':'var(--red)';
  document.getElementById('timer-ring').style.strokeDashoffset = offset;
  document.getElementById('timer-ring').style.stroke = color;
  document.getElementById('timer-text').textContent = timeLeft;
  document.getElementById('timer-text').style.color = color;
}

function autoSkip() {
  answers.push({ q: quizQuestions[currentQIndex], chosen: null });
  moveNext();
}

function selectAnswer(opt, btn) {
  if (selectedAnswer !== null) return;
  clearInterval(timerInterval);
  selectedAnswer = opt;
  document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('btn-next').classList.remove('hidden');
  document.getElementById('btn-skip').classList.add('hidden');
}

function skipQuestion() {
  clearInterval(timerInterval);
  answers.push({ q: quizQuestions[currentQIndex], chosen: null });
  moveNext();
}

function nextQuestion() {
  answers.push({ q: quizQuestions[currentQIndex], chosen: selectedAnswer });
  moveNext();
}

function moveNext() {
  currentQIndex++;
  if (currentQIndex < quizQuestions.length) {
    renderQuestion();
  } else {
    showResults();
  }
}

// ══════════════════════════════════════════
// RESULTS
// ══════════════════════════════════════════
function showResults() {
  clearInterval(timerInterval);
  const total   = answers.length;
  const correct = answers.filter(a => a.chosen && a.chosen===a.q.ans).length;
  const skipped = answers.filter(a => !a.chosen).length;
  const wrong   = total - correct - skipped;
  const score   = Math.round((correct/total)*100);
  const xp      = correct * 10 + (score===100?50:0);

  // ── Persist results to localStorage ──
  userData.quizzes++;
  userData.xp += xp;
  if (userData.best === null || score > userData.best) userData.best = score;

  const now = new Date();
  const dateStr = now.toLocaleDateString('en-GB', { day:'2-digit', month:'short' });
  if (!userData.recent) userData.recent = [];
  userData.recent.push({
    chapter: quizQuestions[0]?.chapter || '',
    total,
    score,
    xp,
    correct,
    wrong,
    skipped,
    date: dateStr
  });
  // Keep only last 50 entries
  if (userData.recent.length > 50) userData.recent = userData.recent.slice(-50);
  saveUserData(currentUser.username, userData);

  // ── Render ──
  const color = score>=80?'var(--green)':score>=50?'var(--gold)':'var(--red)';
  const label = score>=80?'Excellent':score>=50?'Good Job':'Keep Going';

  document.getElementById('res-score-pct').textContent = score+'%';
  document.getElementById('res-score-pct').style.color = color;
  document.getElementById('res-score-label').textContent = label;
  document.getElementById('res-chapter').textContent = quizQuestions[0]?.chapter || '';
  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-wrong').textContent   = wrong;
  document.getElementById('res-skipped').textContent = skipped;
  document.getElementById('res-xp').textContent      = '+'+xp;

  const circ   = 339.3;
  const offset = circ * (1 - score/100);
  const ring   = document.getElementById('score-ring');
  ring.style.stroke          = color;
  ring.style.filter          = `drop-shadow(0 0 8px ${color})`;
  ring.style.strokeDashoffset = circ;
  setTimeout(() => { ring.style.strokeDashoffset = offset; }, 100);

  const reviewEl = document.getElementById('res-review');
  reviewEl.innerHTML = answers.map((a, i) => {
    const isCorrect = a.chosen && a.chosen===a.q.ans;
    const isSkipped = !a.chosen;
    const c  = isCorrect?'var(--green)':isSkipped?'var(--gold)':'var(--red)';
    const bg = isCorrect?'rgba(0,230,118,.07)':isSkipped?'rgba(255,215,0,.07)':'rgba(255,71,87,.07)';
    const bd = isCorrect?'rgba(0,230,118,.2)':isSkipped?'rgba(255,215,0,.2)':'rgba(255,71,87,.2)';
    const detail = isCorrect
      ? `<span style="color:var(--green)">✓ ${a.q.ans}</span>`
      : isSkipped
      ? `<span style="color:var(--gold)">Skipped · Correct: ${a.q.ans}</span>`
      : `<div style="color:var(--red)">✗ Your answer: ${a.chosen}</div><div style="color:var(--green);margin-top:3px">✓ Correct: ${a.q.ans}</div>`;
    return `<div style="background:${bg};border:1px solid ${bd};border-radius:14px;padding:12px 14px">
      <div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;line-height:1.4"><span style="color:var(--ink2);font-weight:800">Q${i+1}.</span> ${a.q.q}</div>
      <div style="font-size:12px;font-weight:700">${detail}</div>
    </div>`;
  }).join('');

  showScreen('screen-results');
}

function goHome() {
  updateHomeStats();
  renderRecentList();
  showScreen('screen-home');
}

// ══════════════════════════════════════════
// RESET DATA
// ══════════════════════════════════════════
function confirmResetData() {
  if (confirm(`Clear all saved data for ${currentUser.name}? This cannot be undone.`)) {
    userData = { quizzes: 0, xp: 0, best: null, recent: [] };
    saveUserData(currentUser.username, userData);
    updateHomeStats();
    renderRecentList();
  }
}

// Init
showScreen('screen-login');
</script>
</body>
</html>
